name: Bug Report
description: Report a bug in Homelab
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        - proxy
        - docker
        - dns
        - home_assistant
        - Workflows (expose_service, teardown_service, service_status, infrastructure_overview)
        - Server core (homelab_modules, homelab_health, approval)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue?
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `homelab-infra --version`, Python version and MCP client.
