[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-infra-mcp"
version = "2.1.0"
description = "Homelab MCP bundle: Nginx Proxy Manager, Docker and Cloudflare DNS, plus opt-in Uptime Kuma, Cloudflare Tunnel, AdGuard Home and Authentik, with skills."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seaynic Labs" }]
# mcp is capped below 2: 2.x removed FastMCP, and unpinned installs crash.
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "docker>=7.0",
    "urllib3>=2.7.0",
    "pyyaml>=6.0",
]
keywords = ["mcp", "homelab", "docker", "nginx-proxy-manager", "dns", "cloudflare", "home-assistant", "uptime-kuma", "adguard", "authentik", "skills"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homelab-infra = "homelab_infra_mcp.server:main"
homelab-infra-mcp = "homelab_infra_mcp.server:main"

[project.urls]
Repository = "https://github.com/seayniclabs/homelab-infra-mcp"
Issues = "https://github.com/seayniclabs/homelab-infra-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_infra_mcp"]

# One source for the skills: the repo's skills/ folder ships inside the package too,
# so the server can serve it as MCP prompts and resources.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "homelab_infra_mcp/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "scripts", "README.md", "LICENSE", "CREDITS.md", "CHANGELOG.md", "SECURITY.md", "server.json", "uv.lock", ".claude-plugin", ".mcp.json", "tool-manifest.lock.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
