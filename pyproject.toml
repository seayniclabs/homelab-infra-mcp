[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homelab-infra-mcp"
version = "2.0.0"
description = "Homelab MCP bundle: Nginx Proxy Manager, Docker and Cloudflare DNS, with one-call expose and teardown of a service."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Seaynic Labs" }]
# mcp is capped below 2: 2.x removed FastMCP, and unpinned installs crash.
dependencies = [
    "mcp[cli]>=1.27,<2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "docker>=7.0",
    "urllib3>=2.7.0",
    "pyyaml>=6.0",
]
keywords = ["mcp", "homelab", "docker", "nginx-proxy-manager", "dns", "cloudflare", "home-assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homelab-infra = "homelab_infra_mcp.server:main"
homelab-infra-mcp = "homelab_infra_mcp.server:main"

[project.urls]
Repository = "https://github.com/seayniclabs/homelab-infra-mcp"
Issues = "https://github.com/seayniclabs/homelab-infra-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_infra_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
